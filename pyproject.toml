[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lansweeper-outpost"
version = "0.3.0"
description = "Lightweight, self-hostable hub-and-sensor asset discovery (codename Outpost)."
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5.0",
    "jsonschema>=4.0",
]

[tool.setuptools]
packages = ["outpost"]

[tool.setuptools.package-data]
outpost = ["schema.json"]
